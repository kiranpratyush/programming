version: '3.8'

services:
  postgres:
    image: postgres
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: backend_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/

volumes:
  pg_data:
    name: pg_data_volume
