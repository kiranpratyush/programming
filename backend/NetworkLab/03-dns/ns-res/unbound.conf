# ns-res: recursive resolver only. Lab names go to ns-auth, everything else is resolved
# from the root servers (no forward-zone, no 8.8.8.8).
# run: ip netns exec ns-res unbound -d -c /home/pratyush/projects/programming/backend/NetworkLab/03-dns/ns-res/unbound.conf
server:
    interface: 10.10.0.115
    port: 53
    do-ip6: no
    do-daemonize: no
    username: "pratyush"
    chroot: ""
    directory: ""
    pidfile: "/tmp/unbound-ns-res.pid"
    use-syslog: no
    logfile: ""
    verbosity: 1

    # only the lab may use this resolver
    access-control: 127.0.0.0/8 allow
    access-control: 10.10.0.0/24 allow

    # .internal is not in the public root, so there is no DNSSEC chain for it
    domain-insecure: "lab.internal"

    # by default Unbound answers NXDOMAIN itself for private reverse zones (10.in-addr.arpa)
    local-zone: "10.in-addr.arpa." nodefault

# lab.internal: start at ns-auth. b.lab.internal is found by following its delegation.
stub-zone:
    name: "lab.internal"
    stub-addr: 10.10.0.114

# D4 (reverse DNS), enable once ns-auth has the zone:
# stub-zone:
#     name: "0.10.10.in-addr.arpa"
#     stub-addr: 10.10.0.114
